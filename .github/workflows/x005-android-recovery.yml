name: X005 Android Recovery

on:
  workflow_dispatch:
  push:
    branches: [ 'build/p0g-gpt6-cleanroom-v1', 'build/x004-export-decode-device' ]
    paths:
      - 'app/src/main/java/com/clw/aivideotranslator/session/**'
      - 'app/src/main/java/com/clw/aivideotranslator/semantic/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/x005-android-recovery.yml'

jobs:
  recovery-instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install compile SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run X005 Android recovery instrumentation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: gradle --stacktrace connectedDebugAndroidTest

      - name: Upload X005 Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x005-android-recovery-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
