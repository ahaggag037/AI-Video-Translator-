name: Internal Release Readiness Patch

on:
  push:
    branches: [ 'build/path-a-recovery-correction' ]
    paths:
      - '.github/workflows/internal-release-readiness-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert patch context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "build/path-a-recovery-correction"
          test -f tools/apply_release_readiness_patch.py

      - name: Apply guarded patch
        run: python tools/apply_release_readiness_patch.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'ProductPresentationUnitResolver.resolve' app/src/main/java/com/clw/aivideotranslator/app/ProductAppHostStyleBridge.kt
          grep -q 'ProductRoute.RESULT' app/src/main/java/com/clw/aivideotranslator/app/ProductRouteSynchronizer.kt
          grep -q 'exportCommittedSrtOnly' app/src/main/java/com/clw/aivideotranslator/app/ProductAppHostStyleBridge.kt
          grep -q 'BuildConfig.VERSION_NAME' app/src/main/java/com/clw/aivideotranslator/app/ProductAppHostStyleBridge.kt

      - name: Commit production patch and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_release_readiness_patch.py
          git rm .github/workflows/internal-release-readiness-patch.yml
          git add app/src/main app/src/test
          git status --short
          git commit -m "release: close restart recovery and dead-control gaps"
          git push origin HEAD:build/path-a-recovery-correction
