name: X006 Performance Qualification

on:
  workflow_dispatch:
  push:
    branches: [ 'parallel/release-x006-performance' ]

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate target-device runner
        run: bash -n scripts/run_x006_target_device.sh

      - name: Unit tests
        run: gradle --stacktrace testDebugUnitTest

      - name: Lint
        run: gradle --stacktrace lintDebug

      - name: Build debug APK and Android test APK
        run: gradle --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x006-build-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn

  api35-instrumented:
    needs: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install compile SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API35 qualification instrumentation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: gradle --stacktrace connectedDebugAndroidTest

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x006-api35-instrumented-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: error
