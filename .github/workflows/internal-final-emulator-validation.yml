name: Internal Final Emulator Validation

on:
  push:
    branches: [ 'build/path-a-recovery-correction' ]
    paths:
      - '.github/workflows/internal-final-emulator-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run full Android instrumentation and launcher smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: |
            set -eu
            gradle --stacktrace connectedDebugAndroidTest
            gradle --stacktrace installDebug
            adb shell am force-stop com.clw.aivideotranslator
            adb shell am start -W -n com.clw.aivideotranslator/.ProductMainActivity > launcher-smoke.txt
            cat launcher-smoke.txt
            grep -Eq 'Status: ok|Complete' launcher-smoke.txt
            adb shell pidof com.clw.aivideotranslator
            adb exec-out screencap -p > final-launcher.png

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-api35-emulator-evidence
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            launcher-smoke.txt
            final-launcher.png
          if-no-files-found: warn
