name: Final Signed Release APK

on:
  push:
    branches:
      - build/path-a-recovery-correction
    paths:
      - .github/workflows/final-signed-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AI_TRANSLATOR_RELEASE_STORE_FILE: release-keystore.jks
      AI_TRANSLATOR_RELEASE_STORE_PASSWORD: ${{ secrets.AI_TRANSLATOR_RELEASE_STORE_PASSWORD }}
      AI_TRANSLATOR_RELEASE_KEY_ALIAS: ${{ secrets.AI_TRANSLATOR_RELEASE_KEY_ALIAS }}
      AI_TRANSLATOR_RELEASE_KEY_PASSWORD: ${{ secrets.AI_TRANSLATOR_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate release signing identity
        env:
          KEYSTORE_B64: ${{ secrets.AI_TRANSLATOR_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64:-}" || { echo "Missing AI_TRANSLATOR_RELEASE_KEYSTORE_B64"; exit 1; }
          test -n "${AI_TRANSLATOR_RELEASE_STORE_PASSWORD:-}" || { echo "Missing AI_TRANSLATOR_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "${AI_TRANSLATOR_RELEASE_KEY_ALIAS:-}" || { echo "Missing AI_TRANSLATOR_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "${AI_TRANSLATOR_RELEASE_KEY_PASSWORD:-}" || { echo "Missing AI_TRANSLATOR_RELEASE_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks
          chmod 600 release-keystore.jks
          keytool -list -keystore release-keystore.jks \
            -storepass "$AI_TRANSLATOR_RELEASE_STORE_PASSWORD" \
            -alias "$AI_TRANSLATOR_RELEASE_KEY_ALIAS" >/dev/null

      - name: Unit tests
        run: gradle --stacktrace testDebugUnitTest

      - name: Lint
        run: gradle --stacktrace lintDebug

      - name: Build signed release APK
        run: gradle --stacktrace :app:assembleRelease

      - name: Verify release identity, version, and checksum
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/release/app-release.apk"
          OUT="app/build/outputs/apk/release/AI-Video-Translator-1.0.0.apk"
          test -s "$SRC"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SRC"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$SRC" | head -n 1)"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -F "versionCode='7'"
          printf '%s\n' "$BADGING" | grep -F "versionName='1.0.0'"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Translator-1.0.0-final-signed
          path: |
            app/build/outputs/apk/release/AI-Video-Translator-1.0.0.apk
            app/build/outputs/apk/release/AI-Video-Translator-1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Remove decoded keystore
        if: always()
        run: rm -f release-keystore.jks
