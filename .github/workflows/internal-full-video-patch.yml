name: Internal Full Video Product Patch

on:
  push:
    branches: [ 'build/path-a-recovery-correction' ]
    paths: [ '.github/full-video-product-patch-request' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'ahaggag037'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply asserted product wiring patch
        run: python3 tools/apply_full_video_product_patch.py
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/clw/aivideotranslator/session/TranslationSessionViewModel.kt app/src/main/java/com/clw/aivideotranslator/ProductMainActivity.kt
          git commit -m "product: wire durable full-video STT into launcher"
          git push origin HEAD:build/path-a-recovery-correction
