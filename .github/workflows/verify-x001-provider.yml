name: Verify X001 Hosted Provider Timing

on:
  push:
    branches: [ 'build/verify-x001-provider' ]
    paths:
      - '.github/workflows/verify-x001-provider.yml'

jobs:
  hosted-provider-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39642c0765d93e1a8bae8e7aaf29e1d0aa9fa4bc

      - name: Check provider secret availability
        id: secret
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "NVIDIA_API_KEY repository secret is not configured; hosted probe skipped." | tee provider_probe_status.txt
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Hosted provider secret is configured; value will not be printed or persisted." | tee provider_probe_status.txt
          fi

      - name: Install deterministic speech generator
        if: steps.secret.outputs.configured == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak

      - name: Generate controlled WAV samples
        if: steps.secret.outputs.configured == 'true'
        run: |
          mkdir -p provider-probe
          espeak -s 145 -v en-us -w provider-probe/speech.wav "hello world this is a timing verification sample"
          python3 - <<'PY'
          import hashlib, json, wave
          from pathlib import Path

          root = Path('provider-probe')
          src = root / 'speech.wav'
          with wave.open(str(src), 'rb') as r:
              params = r.getparams()
              frames = r.readframes(r.getnframes())

          if params.comptype != 'NONE':
              raise SystemExit('unexpected compressed WAV from espeak')

          leading = {'a': 0.25, 'b': 1.25, 'c': 2.25}
          meta = {}
          for name, seconds in leading.items():
              silence_frames = round(seconds * params.framerate)
              silence = b'\x00' * silence_frames * params.nchannels * params.sampwidth
              out = root / f'sample_{name}.wav'
              with wave.open(str(out), 'wb') as w:
                  w.setparams(params)
                  w.writeframes(silence + frames)
              data = out.read_bytes()
              with wave.open(str(out), 'rb') as r:
                  duration = r.getnframes() / r.getframerate()
              meta[name] = {
                  'leading_silence_seconds': seconds,
                  'duration_seconds': duration,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'sample_rate_hz': params.framerate,
                  'channels': params.nchannels,
                  'sample_width_bytes': params.sampwidth,
              }
          (root / 'sample_meta.json').write_text(json.dumps(meta, indent=2, sort_keys=True))
          PY

      - name: Call exact hosted NVCF HTTP endpoint
        if: steps.secret.outputs.configured == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          endpoint='https://1598d209-5e27-4d3c-8079-4751568b1081.invocation.api.nvcf.nvidia.com/v1/audio/transcriptions'
          for name in a b c; do
            code=$(curl --silent --show-error \
              --output "provider-probe/response_${name}.json" \
              --write-out '%{http_code}' \
              --request POST "$endpoint" \
              --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
              --form 'language=en-US' \
              --form 'word_time_offsets=True' \
              --form "file=@provider-probe/sample_${name}.wav;type=audio/wav")
            printf '%s' "$code" > "provider-probe/http_${name}.txt"
            case "$code" in
              2??) ;;
              *) echo "Hosted provider request ${name} returned HTTP ${code}"; exit 1 ;;
            esac
          done

      - name: Produce redacted timing evidence
        if: steps.secret.outputs.configured == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, math, re
          from pathlib import Path

          root = Path('provider-probe')
          meta = json.loads((root / 'sample_meta.json').read_text())

          def locate_words(obj):
              results = obj.get('results') if isinstance(obj, dict) else None
              if isinstance(results, list):
                  for ri, result in enumerate(results):
                      if not isinstance(result, dict):
                          continue
                      alts = result.get('alternatives')
                      if isinstance(alts, list) and alts and isinstance(alts[0], dict):
                          words = alts[0].get('words')
                          if isinstance(words, list) and words:
                              return f'results[{ri}].alternatives[0].words', words
              wi = obj.get('words_info') if isinstance(obj, dict) else None
              if isinstance(wi, dict) and isinstance(wi.get('words'), list) and wi['words']:
                  return 'words_info.words', wi['words']
              words = obj.get('words') if isinstance(obj, dict) else None
              if isinstance(words, list) and words:
                  return 'words', words
              raise ValueError('no supported non-empty word timing array found')

          def number(item, names):
              for n in names:
                  if n in item and isinstance(item[n], (int, float)) and not isinstance(item[n], bool):
                      return n, float(item[n])
              raise ValueError(f'missing numeric field from {names}')

          responses = {}
          starts = []
          xs = []
          raw_number_re = re.compile(r'\"(?:start_time|start|start_ms|end_time|end|end_ms)\"\s*:\s*(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)')

          for name in ('a', 'b', 'c'):
              raw = (root / f'response_{name}.json').read_bytes()
              text = raw.decode('utf-8')
              obj = json.loads(text)
              path, words = locate_words(obj)
              first = words[0]
              last = words[-1]
              s_field, first_start = number(first, ('start_time', 'start', 'start_ms'))
              e_field, first_end = number(first, ('end_time', 'end', 'end_ms'))
              _, last_start = number(last, ('start_time', 'start', 'start_ms'))
              _, last_end = number(last, ('end_time', 'end', 'end_ms'))
              lexemes = raw_number_re.findall(text)
              responses[name] = {
                  'http_status': int((root / f'http_{name}.txt').read_text()),
                  'response_sha256': hashlib.sha256(raw).hexdigest(),
                  'top_level_keys': sorted(obj.keys()) if isinstance(obj, dict) else [],
                  'word_path': path,
                  'word_count': len(words),
                  'start_field': s_field,
                  'end_field': e_field,
                  'first_start_raw': first_start,
                  'first_end_raw': first_end,
                  'last_start_raw': last_start,
                  'last_end_raw': last_end,
                  'timing_numeric_lexemes_first_8': lexemes[:8],
              }
              xs.append(meta[name]['leading_silence_seconds'])
              starts.append(first_start)

          xbar = sum(xs) / len(xs)
          ybar = sum(starts) / len(starts)
          denom = sum((x - xbar) ** 2 for x in xs)
          slope = sum((x - xbar) * (y - ybar) for x, y in zip(xs, starts)) / denom
          intercept = ybar - slope * xbar
          residuals = [y - (slope * x + intercept) for x, y in zip(xs, starts)]
          max_abs_residual = max(abs(v) for v in residuals)

          if 0.75 <= slope <= 1.25:
              controlled_delta_classification = 'SECONDS_PER_SECOND'
              residual_limit = 0.20
          elif 750.0 <= slope <= 1250.0:
              controlled_delta_classification = 'MILLISECONDS_PER_SECOND'
              residual_limit = 200.0
          else:
              controlled_delta_classification = 'AMBIGUOUS'
              residual_limit = 0.0

          offset_tracks_inserted_silence = (
              controlled_delta_classification != 'AMBIGUOUS'
              and max_abs_residual <= residual_limit
              and starts[0] < starts[1] < starts[2]
          )

          evidence = {
              'probe_contract': {
                  'provider': 'nvidia',
                  'model': 'nvidia/parakeet-ctc-1_1b-asr',
                  'endpoint': 'https://1598d209-5e27-4d3c-8079-4751568b1081.invocation.api.nvcf.nvidia.com/v1/audio/transcriptions',
                  'language': 'en-US',
                  'word_time_offsets': 'True',
                  'w1_code_sha': '39642c0765d93e1a8bae8e7aaf29e1d0aa9fa4bc',
              },
              'samples': meta,
              'responses': responses,
              'controlled_leading_silence_affine_fit': {
                  'slope_raw_units_per_second': slope,
                  'intercept_raw_units': intercept,
                  'max_abs_residual_raw_units': max_abs_residual,
                  'classification': controlled_delta_classification,
                  'offset_tracks_inserted_silence': offset_tracks_inserted_silence,
              },
              'redaction': 'No API key, raw transcript, or complete provider response is persisted in this evidence artifact.',
          }
          (root / 'X001_hosted_provider_redacted_evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True))

          print('X001_PROVIDER_EVIDENCE')
          print(json.dumps(evidence['controlled_leading_silence_affine_fit'], sort_keys=True))
          for name in ('a', 'b', 'c'):
              r = responses[name]
              print(name, 'sample_sha256=', meta[name]['sha256'], 'response_sha256=', r['response_sha256'], 'path=', r['word_path'], 'first_start=', r['first_start_raw'], 'last_end=', r['last_end_raw'])

          # Raw provider bodies are deliberately removed before artifact upload.
          for name in ('a', 'b', 'c'):
              (root / f'response_{name}.json').unlink()
          PY

      - name: Upload redacted provider evidence
        if: steps.secret.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: x001-hosted-provider-redacted-evidence
          path: |
            provider-probe/X001_hosted_provider_redacted_evidence.json
            provider-probe/sample_meta.json
            provider_probe_status.txt
          if-no-files-found: error

      - name: Upload no-secret status
        if: steps.secret.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: x001-provider-secret-status
          path: provider_probe_status.txt
          if-no-files-found: error
