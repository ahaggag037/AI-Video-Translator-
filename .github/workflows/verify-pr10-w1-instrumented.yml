name: Verify PR10 W1 X001 Instrumented

on:
  push:
    branches: [ 'build/verify-pr10-w1-instrumented' ]
    paths:
      - '.github/workflows/verify-pr10-w1-instrumented.yml'

jobs:
  x001-instrumented:
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c71c77e0b6f89a73f352da25d531c996c85a004

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install compile SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run exact W1 X001 instrumented regressions
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.clw.aivideotranslator.X001PresentationClockInstrumentedTest,com.clw.aivideotranslator.session.X001NullTimingDurabilityInstrumentedTest,com.clw.aivideotranslator.session.X001NullTimingViewModelInstrumentedTest --stacktrace

      - name: Upload X001 verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr10-x001-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
